<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Simulador del examen teórico de la licencia de armas E con las 423 preguntas del cuestionario oficial.">
<title>Simulador Licencia E</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column field-manual, temas as a ruled index; quiz is a single focused card with a sticky progress bar */
:root {
  --bg: #F1F2EA;
  --surface: #FBFBF6;
  --ink: #1C2318;
  --muted: #5D6755;
  --line: #D5D9C9;
  --loden: #3E4E37;
  --loden-soft: #E3E7D9;
  --blaze: #D4460C;
  --blaze-ink: #FFFFFF;
  --ok: #2B7A43;
  --ok-bg: #E1F0E4;
  --bad: #B3261E;
  --bad-bg: #FAE4E1;
  --sel: #FCE9DF;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10140E; --surface: #182016; --ink: #E7EBDF; --muted: #9BA592; --line: #2C3627;
    --loden: #AFC29A; --loden-soft: #222C1E; --blaze: #FF7B3F; --blaze-ink: #1B0D05;
    --ok: #74D08E; --ok-bg: #18301F; --bad: #FF8B7C; --bad-bg: #3A1B17; --sel: #3A2216;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10140E; --surface: #182016; --ink: #E7EBDF; --muted: #9BA592; --line: #2C3627;
  --loden: #AFC29A; --loden-soft: #222C1E; --blaze: #FF7B3F; --blaze-ink: #1B0D05;
  --ok: #74D08E; --ok-bg: #18301F; --bad: #FF8B7C; --bad-bg: #3A1B17; --sel: #3A2216;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: .01em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blaze); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }

/* ---------- header ---------- */
.masthead { padding-block: 28px 20px; display: grid; gap: 6px; border-bottom: 2px solid var(--ink); }
.masthead .kicker { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.plate { display: inline-block; background: var(--blaze); color: var(--blaze-ink); font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; padding: 1px 10px; letter-spacing: .06em; }
.masthead h1 { font-size: clamp(2.6rem, 9vw, 4.2rem); line-height: .92; text-transform: uppercase; }
.masthead p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }

/* ---------- stats strip ---------- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.stat { padding: 14px 12px 14px 0; display: grid; gap: 6px; align-content: start; min-width: 0; }
.stat .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat + .stat { padding-left: 14px; border-left: 1px solid var(--line); }
.stat b { font-family: var(--font-display); font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat b small { font-size: 1rem; color: var(--muted); font-weight: 600; }
.spark { display: flex; gap: 3px; align-items: flex-end; height: 26px; margin-top: 4px; }
.spark i { width: 7px; background: var(--loden); opacity: .85; display: block; min-height: 2px; }
.spark i.last { background: var(--blaze); opacity: 1; }

/* ---------- exam CTA ---------- */
.exam { margin-top: 22px; background: var(--loden); color: var(--bg); padding: 20px; display: grid; gap: 14px; }
.exam h2 { font-size: 1.9rem; text-transform: uppercase; }
.exam p { margin: 0; opacity: .9; }
.reparto { display: flex; flex-wrap: wrap; gap: 6px; }
.reparto span { border: 1px solid currentColor; padding: 1px 7px; opacity: .9; }
.exam-actions { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; }
.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-size: .93rem; }
.check input { width: 18px; height: 18px; accent-color: var(--blaze); }
.btn { border: 0; padding: 11px 18px; font-weight: 700; font-size: .95rem; letter-spacing: .02em; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--blaze); color: var(--blaze-ink); border-color: var(--blaze); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 6px; text-decoration: underline; text-underline-offset: 3px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- quick modes ---------- */
.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.mode { text-align: left; background: var(--surface); border: 1.5px solid var(--line); padding: 14px; display: grid; gap: 2px; min-width: 0; }
.mode:hover:not(:disabled) { border-color: var(--ink); }
.mode strong { font-family: var(--font-display); font-size: 1.35rem; text-transform: uppercase; line-height: 1.1; }
.mode span { color: var(--muted); font-size: .88rem; }
.mode:disabled { opacity: .5; cursor: not-allowed; }
.mode .count { font-family: var(--font-mono); font-size: .8rem; color: var(--blaze); }

/* ---------- temario index ---------- */
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 34px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.section-head h2 { font-size: 1.6rem; text-transform: uppercase; }
.temas { list-style: none; margin: 0; padding: 0; }
.tema { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.tema .num { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; color: var(--blaze); line-height: 1; }
.tema h3 { font-family: var(--font-body); font-size: 1rem; font-weight: 600; line-height: 1.3; }
.tema .meta { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: .82rem; margin-top: 2px; }
.bar { height: 6px; background: var(--loden-soft); margin-top: 8px; display: flex; overflow: hidden; }
.bar .ok { background: var(--ok); }
.bar .ko { background: var(--bad); }
.tema .btn { padding: 8px 12px; font-size: .88rem; }
.legend { display: flex; gap: 14px; font-size: .78rem; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }

.foot { margin-top: 30px; display: grid; gap: 10px; color: var(--muted); font-size: .85rem; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--bad-bg); color: var(--ink); padding: 10px 12px; }

/* ---------- quiz ---------- */
.qbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.qbar-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.qbar .title { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; text-transform: uppercase; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progress { height: 4px; background: var(--loden-soft); }
.progress div { height: 100%; background: var(--blaze); transition: width .25s; }
.qcard { margin-top: 20px; display: grid; gap: 16px; }
.qtag { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); }
.qtag .chip { background: var(--loden-soft); color: var(--loden); padding: 2px 8px; }
.qtext { font-size: clamp(1.12rem, 3.6vw, 1.32rem); font-weight: 600; line-height: 1.45; margin: 0; max-width: 62ch; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; background: var(--surface); border: 1.5px solid var(--line); padding: 13px 14px; line-height: 1.4; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt .l { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; width: 30px; height: 30px; display: grid; place-items: center; border: 1.5px solid var(--line); line-height: 1; }
.opt span:last-child { padding-top: 4px; min-width: 0; }
.opt.chosen { border-color: var(--blaze); background: var(--sel); }
.opt.chosen .l { background: var(--blaze); color: var(--blaze-ink); border-color: var(--blaze); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .l { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .l { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.verdict { padding: 12px 14px; font-weight: 600; border-left: 4px solid; }
.verdict.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.verdict.ko { background: var(--bad-bg); border-color: var(--bad); color: var(--ink); }
.verdict.ko b { color: var(--bad); }
.qnav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.qnav .right { display: flex; gap: 10px; margin-left: auto; }
.dots { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 6px; margin-top: 8px; }
.dot { height: 34px; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: .78rem; padding: 0; }
.dot.done { background: var(--loden-soft); border-color: var(--loden); color: var(--loden); }
.dot.cur { border-color: var(--blaze); box-shadow: inset 0 0 0 1.5px var(--blaze); }
.hint { color: var(--muted); font-size: .8rem; }

/* ---------- results ---------- */
.score { padding-block: 26px 18px; border-bottom: 2px solid var(--ink); display: grid; gap: 6px; }
.score .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(3.4rem, 14vw, 5.4rem); line-height: .9; font-variant-numeric: tabular-nums; }
.score .big small { font-size: .45em; color: var(--muted); }
.bytema { list-style: none; padding: 0; margin: 0; }
.bytema li { display: grid; grid-template-columns: 54px minmax(0, 1fr) 64px; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.bytema .num { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: var(--blaze); }
.bytema .frac { text-align: right; font-family: var(--font-mono); font-size: .85rem; }
.errors { display: grid; gap: 14px; margin-top: 12px; }
.err { background: var(--surface); border: 1.5px solid var(--line); padding: 14px; display: grid; gap: 8px; }
.err p { margin: 0; }
.err .yours { color: var(--bad); }
.err .good { color: var(--ok); font-weight: 600; }
.res-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.empty { padding: 18px; border: 1.5px dashed var(--line); color: var(--muted); }

.sync-pill { display: inline-flex; align-items: center; gap: 7px; margin-top: 8px; font-size: .8rem; font-weight: 600; color: var(--muted); text-decoration: none; }
.sync-pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.sync-pill.ok::before { background: var(--ok); }
.sync-pill.busy::before { background: var(--blaze); }
.sync-pill.error { color: var(--bad); }
.sync-pill.error::before { background: var(--bad); }
.sync-pill:hover { color: var(--ink); text-decoration: underline; }
.syncbox { margin-top: 30px; border: 1.5px solid var(--line); background: var(--surface); padding: 18px; display: grid; gap: 12px; }
.syncbox h3 { font-size: 1.4rem; text-transform: uppercase; }
.syncbox p { margin: 0; color: var(--muted); max-width: 62ch; }
.syncbox .fields { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; }
.syncbox label { display: grid; gap: 4px; min-width: 0; }
.syncbox input { font: inherit; font-size: .92rem; padding: 10px 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
.syncbox input:focus { border-color: var(--ink); outline: none; }
.syncbox .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.syncbox .sync-msg { color: var(--ink); font-size: .9rem; }
.syncbox .sync-msg:empty { display: none; }
@media (max-width: 520px) {
  .syncbox .fields { grid-template-columns: minmax(0, 1fr); }
  .quick { grid-template-columns: minmax(0, 1fr); }
  .tema { grid-template-columns: 40px minmax(0, 1fr); }
  .tema .btn { grid-column: 2; justify-self: start; }
  .stat b { font-size: 1.55rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
const BANCO_RAW = [[1,1,"El arma de fuego que se recarga automáticamente, después de cada disparo, efectuando varios disparos sucesivos accionando el disparador una sola vez, se denomina:",["Arma de fuego semiautomática.","Arma de fuego de repetición.","Arma de fuego automática."],2],[1,2,"El arma de fuego que después de cada disparo, se recarga automáticamente y solo es posible efectuar un disparo al accionar el disparador cada vez, se denomina:",["Arma de fuego semiautomática.","Arma de fuego de repetición.","Arma de fuego automática."],0],[1,3,"Si el arma de fuego se recarga después de cada disparo, mediante un mecanismo accionado por el tirador, estaremos ante:",["Arma de fuego semiautomática.","Arma de fuego de repetición.","Arma de fuego automática."],1],[1,4,"¿Cómo se denomina el arma de fuego sin depósito de municiones, que se carga antes de cada disparo mediante la introducción manual de un cartucho en la recámara, o alojamiento especial a la entrada del cañón?:",["Arma de un solo tiro.","Arma de fuego automática.","Arma de fuego semiautomática."],0],[1,5,"¿Qué elemento de un arma de fuego conduce y estabiliza el proyectil?.",["El disparador.","El cañón.","El estabilizador."],1],[1,6,"La culata de un arma sirve para:",["Instalar en ella el punto de mira.","Apoyar el arma sobre el hombro para efectuar el disparo.","Las armas no tienen culata."],1],[1,7,"Las ánimas de los cañones de escopetas son:",["Estriadas.","Lisas o estriadas.","Con rayas paralelas."],1],[1,8,"Las ánimas de los cañones de un rifle son:",["Lisas.","Estriadas","Estriadas o lisas, dependiendo del fabricante."],1],[1,9,"En una escopeta semiautomática, el percutor, extractor y grapón, son piezas que componen:",["Cerrojo","Culata","Cajón de los mecanismos."],0],[1,10,"¿Qué pieza o piezas protege el guardamonte?.",["La biela y el fiador.","El disparador.","Es macizo."],1],[1,11,"¿Qué misión tiene el muelle del cargador de un rifle?",["Mantener presión en los cartuchos.","Expulsar la vaina cuando se produce el disparo","Elevar el cartucho y colocarlo frente a la recámara."],2],[1,12,"En un arma semiautomática, ¿qué pieza introduce el cartucho en el interior de la recámara?.",["El cierre.","El muelle elevador.","La biela."],0],[1,13,"En escopetas superpuestas, ¿qué misión tiene la banda intermedia ventilada, existente entre los cañones?.",["Refrigerar los cañones.","Amortiguar el efecto de los vientos laterales.","Las dos anteriores."],2],[1,14,"¿Qué mecanismo se encuentra en el interior del cerrojo de un rifle?.",["Mecanismo de percusión.","Mecanismo de disparo.","Mecanismo de expulsión."],0],[1,15,"¿De qué partes se compone el mecanismo de percusión?",["Percutor y muelle del percutor.","Percutor y cabeza del cierre.","Cabeza y punta del percutor."],0],[1,16,"En un rifle, ¿qué pieza arrastra el cartucho hacia la recámara?.",["El cerrojo.","El elevador.","El percutor."],0],[1,17,"Para la expulsión del cartucho, ¿qué pieza engarza el culote del cartucho cuándo está alojado en la recámara?.",["Cerrojo.","Tope de cerrojo.","Uña extractora."],2],[1,18,"En un rifle, ¿qué pieza expulsa la vaina del cartucho de la recámara?",["No hay pieza, es la propia mano del tirador.","El muelle de recuperación.","El extractor."],2],[1,19,"El choke de una escopeta consiste en:",["El estriado de la boca de fuego.","Reducción de la boca de recámara.","Estrangulamiento de la boca de fuego."],2],[1,20,"El choke en el rifle semiautomático consiste:",["El estriado de la boca de fuego.","Reducción de la boca de fuego.","Carecen de choke."],2],[1,21,"¿A qué se denominan extractores en una escopeta superpuesta?:",["Dos uñas que sirven para desalojar los cartuchos de su recámara","A sendas bielas que conectan el disparador con las agujas percutoras.","Dos muelles planos de acción helicoidal."],0],[1,22,"En un arma larga rayada, ¿qué forma tiene la recámara?",["La del proyectil.","La de la vaina.","La del cartucho."],2],[1,23,"En las armas largas rayadas de caza mayor, ¿cómo es la percusión?",["Percusión central","Percusión adelantada.","Sistema “Flobert”."],0],[1,24,"¿Qué dispositivo bloquea el funcionamiento del mecanismo de disparo a voluntad del tirador?",["Elementos de Puntería","Nada","Seguro manual."],2],[1,25,"¿Cómo se denomina el extremo del cañón de una escopeta opuesto a la parte en que se aloja el cartucho?",["Boca","Cámara","Recámara"],0],[1,26,"¿Cuándo decimos que una arma esta montada?.",["Cuando esta preparada para hacer fuego.","Que está totalmente ensamblada.","Ser portada por el tirador."],0],[1,27,"Arma alimentada es aquella que:",["Tiene la munición alojada en el mecanismo de alimentación.","Ya ha efectuado el disparo.","No tiene munición en el mecanismo de alimentación."],0],[1,28,"Arma montada es aquella que:",["El mecanismo de disparo y percusión se encuentra en disposición de funcionamiento.","Está ensamblada y pavonada.","Está ensamblada pero no pavonada."],0],[1,29,"¿Dónde se aloja el cartucho de un arma para ser disparado?.",["En el cargador.","En la recámara.","En la canana."],1],[1,30,"¿Por dónde expulsa una escopeta semiautomática el cartucho disparado?",["Por la ventana trasera del arma.","Por la ventana de ventilación.","Por la ventana de expulsión."],2],[1,31,"Para alimentar una escopeta semiautomática debemos:",["Introducir los cartuchos en la recámara.","Colocar los cartuchos en el depósito.","Montar el arma."],1],[1,32,"¿Qué diferencia existe entre cargar y alimentar un arma.?",["Cargar es montarla para disparar, alimentarla introducir cartuchos en el depósito","Cargar es introducir cartuchos en el deposito, alimentarla es montarla para disparar.","No existe diferencia."],0],[1,33,"¿Puede darse el caso de que además de los extractores, las escopetas superpuestas dispongan de expulsores?",["Todas","Ninguna","Algunos modelos."],2],[1,34,"¿Con qué elementos cuenta un arma para enfilarla hacia un blanco?.",["A través del mecanismo de puntería.","Con un buen empuñamiento.","Con una buena sujeción del arma"],0],[1,35,"¿Qué elemento del arma regula el desplazamiento en altura de un impacto?.",["El alza.","El punto de mira.","La longitud del cañón."],0],[1,36,"¿Qué elemento del arma regula el desplazamiento lateral de un impacto?.",["El alza.","El punto de mira.","La longitud del cañón."],1],[1,37,"¿Qué pieza del mecanismo de disparo transmite el movimiento del disparador?.",["La biela.","El elevador.","El fiador."],0],[1,38,"En una escopeta semiautomática la expulsión de la vaina percutida se produce:",["Manualmente a voluntad del tirador.","Aprovechando la fuerza de retroceso para desplazar el cierre.","Como consecuencia de un mecanismo adyacente al cierre que se acciona cada vez que se presiona el disparador."],1],[1,39,"En algunos rifles, ¿qué misión tienen uno o dos orificios situados en la parte anterior del cajón de los mecanismos?",["Liberar la aguja percutora y que asome","Ver si hay cartucho en la recámara","Salida de gases en caso de rotura del cartucho"],2],[1,40,"El disparador está protegido por:",["El Guardamano","El Guardamonte","La culata"],1],[1,41,"¿La báscula de una escopeta es considerada por el Reglamento de Armas como pieza fundamental del arma?.",["Si","No","Depende de su estructura."],0],[1,42,"¿El cañón de una escopeta es considerada por el Reglamento de Armas como pieza fundamental del arma?.",["Si.","No.","Depende de su estructura."],0],[1,43,"La culata de un rifle es considerada por el Reglamento de Armas como pieza fundamental del arma.",["Si.","No.","Depende de su estructura."],1],[1,44,"¿Los elementos de puntería de una escopeta son considerados piezas fundamentales del arma?.",["Si.","No.","Viene determinada por la posición de los mismos."],1],[1,45,"¿Cuáles son las piezas fundamentales de una escopeta?.",["Culata y cañón.","Cierre, cañón y culata.","Báscula y cañón."],2],[1,46,"¿Cuáles son las piezas fundamentales de un rifle?.",["Cerrojo, cañón y culata.","Cerrojo y cañón.","Culata cañón y elementos de puntería."],1],[1,47,"¿Para qué sirve el segu /* ---------- progress: local copy + optional sync with the user's Google Apps Script ---------- */
// P.q[id] = [vistas, aciertos, últimaCorrecta(1/0), timestamp]; P.r = momento del último reinicio
let P = { q: {}, sims: [], instant: false, r: 0 };
try { const raw = localStorage.getItem(KEY); if (raw) P = Object.assign(P, JSON.parse(raw)); } catch (e) {}
for (const id in P.q) if (P.q[id].length < 4) P.q[id].push(1);
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} Sync.schedule(); }
function record(q, ok) {
  const s = (P.q[q.id] || [0, 0, 0, 0]).slice();
  s[0]++; if (ok) s[1]++; s[2] = ok ? 1 : 0; s[3] = Date.now();
  P.q[q.id] = s;
}
// Same rule as the server: per question the most recent answer wins; simulacros are joined; a reset wipes anything older.
function mergeProgress(a, b) {
  a = a || {}; b = b || {};
  const r = Math.max(a.r || 0, b.r || 0);
  const q = {};
  for (const src of [a.q || {}, b.q || {}]) for (const id in src) {
    const rec = src[id];
    if ((rec[3] || 0) < r) continue;
    if (!q[id] || (rec[3] || 0) > (q[id][3] || 0)) q[id] = rec;
  }
  const m = {};
  for (const s of [...(a.sims || []), ...(b.sims || [])]) if (s.d >= r) m[s.d] = s;
  const sims = Object.values(m).sort((x, y) => x.d - y.d).slice(-100);
  return { q, sims, r };
}

const SYNC_KEY = 'licenciaE.sync';
const Sync = {
  cfg: null, state: 'off', lastOk: 0, timer: null, busy: false, dirty: false,
  load() { try { this.cfg = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); } catch (e) { this.cfg = null; } this.state = this.cfg ? 'idle' : 'off'; },
  store(cfg) { this.cfg = cfg; try { cfg ? localStorage.setItem(SYNC_KEY, JSON.stringify(cfg)) : localStorage.removeItem(SYNC_KEY); } catch (e) {} this.state = cfg ? 'idle' : 'off'; },
  apply(remote) {
    const m = mergeProgress(P, remote);
    P.q = m.q; P.sims = m.sims; P.r = m.r;
    try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {}
  },
  async call(method, cfg) {
    cfg = cfg || this.cfg;
    const url = cfg.url + '?key=' + encodeURIComponent(cfg.key);
    const opts = method === 'POST'
      ? { method: 'POST', body: JSON.stringify({ key: cfg.key, data: { q: P.q, sims: P.sims, r: P.r } }) }
      : { method: 'GET' };
    const res = await fetch(url, opts);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'error');
    return json.data;
  },
  async run(method) {
    if (!this.cfg || this.busy) { if (this.busy) this.dirty = true; return; }
    this.busy = true; this.state = 'busy'; paintSync();
    try {
      const data = await this.call(method);
      this.apply(data);
      this.state = 'ok'; this.lastOk = Date.now();
      if (method === 'GET' && view === 'home') render(home(), true);
    } catch (e) {
      this.state = 'error'; this.dirty = true;
    }
    this.busy = false; paintSync();
    if (this.dirty && this.state === 'ok') { this.dirty = false; this.schedule(); }
  },
  schedule() { if (!this.cfg) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run('POST'), 1200); },
  pull() { if (this.cfg) this.run(this.dirty ? 'POST' : 'GET'); }
};
Sync.load();
// Setup link from the other device: …/#sync=<url>&k=<clave>
(function readSetupLink() {
  try {
    const p = new URLSearchParams(location.hash.slice(1));
    if (p.get('sync') && p.get('k')) {
      Sync.store({ url: p.get('sync'), key: p.get('k') });
      history.replaceState(null, '', location.pathname + location.search);
    }
  } catch (e) {}
})();
const status = q => { const s = P.q[q.id]; return !s ? 'new' : s[2] ? 'ok' : 'ko'; };
const failed = () => BANCO.filter(q => status(q) === 'ko');
const unseen = () => BANCO.filter(q => status(q) === 'new');

/* ---------- helpers ---------- */
const app = document.getElementById('app');
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let view = 'home';
function render(el, keepScroll) {
  const y = window.scrollY;
  view = el.dataset.view || 'other';
  app.replaceChildren(el);
  window.scrollTo(0, keepScroll ? y : 0);
}
function ago(t) {
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return 'hace un momento';
  if (s < 3600) return 'hace ' + Math.round(s / 60) + ' min';
  return 'hace ' + Math.round(s / 3600) + ' h';
}
function syncText() {
  switch (Sync.state) {
    case 'off': return ['off', 'Progreso solo en este dispositivo'];
    case 'busy': return ['busy', 'Sincronizando…'];
    case 'error': return ['error', 'Sin conexión con tu Google. Se guardará al volver'];
    case 'ok': return ['ok', 'Sincronizado ' + ago(Sync.lastOk)];
    default: return ['busy', 'Conectando…'];
  }
}
function paintSync() {
  const el = document.getElementById('sync-status');
  if (!el) return;
  const [cls, txt] = syncText();
  el.className = 'sync-pill ' + cls;
  el.textContent = txt;
}
setInterval(paintSync, 30000);

/* ---------- sync settings panel ---------- */
function syncPanel() {
  const box = h('section', { class: 'syncbox', id: 'sync' });
  const msg = h('p', { class: 'sync-msg', role: 'status' });
  if (!Sync.cfg) {
    const url = h('input', { id: 'sync-url', type: 'url', placeholder: 'https://script.google.com/macros/s/…/exec', autocomplete: 'off' });
    const key = h('input', { id: 'sync-key', type: 'text', placeholder: 'Mínimo 6 caracteres', autocomplete: 'off', autocapitalize: 'off' });
    const btn = h('button', { class: 'btn primary', id: 'sync-connect', onclick: async () => {
      const cfg = { url: url.value.trim(), key: key.value.trim() };
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(cfg.url)) { msg.textContent = 'El enlace debe ser el de la aplicación web de Google Apps Script y terminar en /exec.'; return; }
      if (cfg.key.length < 6) { msg.textContent = 'La clave tiene que tener al menos 6 caracteres.'; return; }
      btn.disabled = true; msg.textContent = 'Comprobando la conexión…';
      try {
        const data = await Sync.call('GET', cfg);
        Sync.store(cfg); Sync.apply(data); Sync.state = 'ok'; Sync.lastOk = Date.now();
        Sync.schedule();
        render(home(), true);
      } catch (e) {
        btn.disabled = false;
        msg.textContent = 'No se pudo conectar. Revisa que el enlace termine en /exec y que al implementar elegiste "Cualquier usuario" en "Quién tiene acceso".';
      }
    } }, 'Conectar');
    box.append(
      h('h3', {}, 'Sincronizar móvil y PC'),
      h('p', {}, 'Guarda tu progreso en tu cuenta de Google para ver lo mismo en todos tus dispositivos. Necesitas el enlace de tu script y una clave que elijas tú; usa la misma clave en todos los dispositivos.'),
      h('div', { class: 'fields' },
        h('label', { for: 'sync-url' }, h('span', { class: 'label' }, 'Enlace de la aplicación web'), url),
        h('label', { for: 'sync-key' }, h('span', { class: 'label' }, 'Tu clave'), key)),
      h('div', { class: 'row' }, btn), msg);
  } else {
    const link = location.origin + location.pathname + '#sync=' + encodeURIComponent(Sync.cfg.url) + '&k=' + encodeURIComponent(Sync.cfg.key);
    const linkOut = h('input', { id: 'sync-link', type: 'text', readonly: true, value: link, hidden: true });
    const copyBtn = h('button', { class: 'btn', id: 'sync-copy', onclick: async () => {
      try { await navigator.clipboard.writeText(link); msg.textContent = 'Enlace copiado. Ábrelo en el otro dispositivo y quedará conectado.'; }
      catch (e) { linkOut.hidden = false; linkOut.select(); msg.textContent = 'Copia este enlace y ábrelo en el otro dispositivo.'; }
    } }, 'Copiar enlace para otro dispositivo');
    box.append(
      h('h3', {}, 'Sincronizar móvil y PC'),
      h('p', {}, 'Conectado a tu cuenta de Google. Cada respuesta se guarda sola y al abrir el simulador en otro dispositivo se carga lo último.'),
      h('div', { class: 'row' },
        h('button', { class: 'btn', id: 'sync-now', onclick: () => Sync.run('POST') }, 'Sincronizar ahora'),
        copyBtn,
        h('button', { class: 'btn ghost', id: 'sync-off', onclick: () => { Sync.store(null); render(home(), true); } }, 'Desconectar este dispositivo')),
      linkOut, msg);
  }
  return box;
}

        h('h3', {}, TEMAS[t]),
        h('div', { class: 'meta' }, h('span', { class: 'mono' }, qs.length + ' preguntas'), h('span', {}, tok + ' dominadas'), tko ? h('span', {}, tko + ' por repasar') : null),
        h('div', { class: 'bar', role: 'img', 'aria-label': tok + ' dominadas y ' + tko + ' falladas de ' + qs.length },
          h('div', { class: 'ok', style: 'width:' + (tok / qs.length * 100) + '%' }),
          h('div', { class: 'ko', style: 'width:' + (tko / qs.length * 100) + '%' }))),
      h('button', { class: 'btn', id: 'tema-' + t, onclick: () => startPractice('Tema ' + ROM[t], shuffle(qs)) }, 'Practicar'));
  }));

  const foot = h('div', { class: 'foot' },
    h('p', { style: 'margin:0' }, (Sync.cfg ? 'Tu progreso se guarda en este dispositivo y en tu cuenta de Google. ' : 'Tu progreso se guarda en este navegador. ') + 'Las respuestas correctas son las del cuestionario oficial de la Guardia Civil para las licencias D y E.'));
  const resetBtn = h('button', { class: 'btn ghost', id: 'reset', onclick: () => {
    resetBtn.hidden = true;
    foot.append(h('div', { class: 'confirm' }, h('span', {}, Sync.cfg ? '¿Borrar todo tu progreso y el historial de simulacros en todos tus dispositivos?' : '¿Borrar todo tu progreso y el historial de simulacros?'),
      h('button', { class: 'btn', id: 'reset-yes', onclick: () => { P = { q: {}, sims: [], instant: P.instant, r: Date.now() }; save(); render(home()); } }, 'Sí, borrar'),
      h('button', { class: 'btn ghost', id: 'reset-no', onclick: () => render(home()) }, 'Cancelar')));
  } }, 'Reiniciar progreso');
  foot.append(h('div', {}, resetBtn));

  const pill = h('a', { id: 'sync-status', href: '#sync', class: 'sync-pill' });
  const page = h('div', { 'data-view': 'home' },
    h('header', { class: 'masthead' },
      h('div', { class: 'kicker' }, h('span', { class: 'plate' }, 'LICENCIA E'), h('span', { class: 'label' }, 'Examen teórico · ' + total + ' preguntas oficiales')),
      h('h1', {}, 'Simulador del examen'),
      h('p', {}, 'Haz simulacros con el reparto del examen, practica tema a tema y repasa solo lo que fallas hasta dominar el cuestionario.'),
      h('div', {}, pill)),
    stats, exam, quick,
    h('div', { class: 'section-head' }, h('h2', {}, 'Temario'), h('span', { class: 'label' }, 'Práctica por tema')),
    temas,
    h('div', { class: 'legend' }, h('span', {}, h('i', { style: 'background:var(--ok)' }), 'Dominada (acertada la última vez)'), h('span', {}, h('i', { style: 'background:var(--bad)' }), 'Por repasar'), h('span', {}, h('i', { style: 'background:var(--loden-soft)' }), 'Sin ver')),
    syncPanel(),
    foot);
  const [cls, txt] = syncText(); pill.className = 'sync-pill ' + cls; pill.textContent = txt;
  return page;
}

/* ---------- quiz engine ---------- */
let S = null;
function startExam() {
  let qs = [];
  for (const t of Object.keys(REPARTO)) qs = qs.concat(shuffle(BANCO.filter(q => q.t === +t)).slice(0, REPARTO[t]));
  S = { kind: 'exam', title: 'Simulacro', qs, ans: Array(qs.length).fill(null), i: 0, instant: !!P.instant, confirm: false };
  render(quizView());
}
function startPractice(title, qs) {
  if (!qs.length) return;
  S = { kind: 'practice', title, qs, ans: Array(qs.length).fill(null), i: 0, instant: true, confirm: false };
  render(quizView());
}

function choose(k) {
  if (S.instant && S.ans[S.i] != null) return;
  S.ans[S.i] = k;
  if (S.instant) { record(S.qs[S.i], k === S.qs[S.i].a); save(); }
  render(quizView());
}
function go(d) {
  const j = S.i + d;
  if (j < 0) return;
  if (j >= S.qs.length) { finish(); return; }
  S.i = j; S.confirm = false; render(quizView());
}
function finish() {
  if (!S.instant) S.qs.forEach((q, i) => { if (S.ans[i] != null) record(q, S.ans[i] === q.a); });
  const okN = S.qs.filter((q, i) => S.ans[i] === q.a).length;
  if (S.kind === 'exam') P.sims.push({ d: Date.now(), ok: okN, n: S.qs.length });
  save();
  render(resultView());
}

function quizView() {
  const q = S.qs[S.i];
  const a = S.ans[S.i];
  const answered = a != null;
  const reveal = S.instant && answered;
  const doneN = S.ans.filter(x => x != null).length;
  const isLast = S.i === S.qs.length - 1;

  const opts = h('div', { class: 'opts', role: 'group', 'aria-label': 'Respuestas' }, q.o.map((txt, k) => {
    let cls = 'opt';
    if (reveal) { if (k === q.a) cls += ' right'; else if (k === a) cls += ' wrong'; }
    else if (a === k) cls += ' chosen';
    return h('button', { class: cls, id: 'opt-' + k, disabled: reveal ? true : null, onclick: () => choose(k) },
      h('span', { class: 'l' }, L[k]), h('span', {}, txt));
  }));

  let verdict = null;
  if (reveal) verdict = a === q.a
    ? h('div', { class: 'verdict ok', role: 'status' }, 'Correcto')
    : h('div', { class: 'verdict ko', role: 'status' }, h('b', {}, 'Fallo. '), 'La respuesta correcta es la ' + L[q.a] + ': ' + q.o[q.a]);

  const canNext = S.instant ? answered : true;
  const nextLabel = isLast ? (S.kind === 'exam' ? (S.instant ? 'Ver resultado' : 'Entregar examen') : 'Ver resultado') : 'Siguiente';
  const nav = h('div', { class: 'qnav' },
    !S.instant ? h('button', { class: 'btn', id: 'prev', disabled: S.i === 0 ? true : null, onclick: () => go(-1) }, 'Anterior') : null,
    h('div', { class: 'right' },
      h('button', { class: 'btn primary', id: 'next', disabled: canNext ? null : true, onclick: () => {
        if (isLast && !S.instant && doneN < S.qs.length && !S.confirm) { S.confirm = true; render(quizView()); return; }
        go(1);
      } }, nextLabel)));

  const confirmBox = S.confirm ? h('div', { class: 'confirm' },
    h('span', {}, 'Te quedan ' + (S.qs.length - doneN) + ' preguntas sin contestar y contarán como fallo.'),
    h('button', { class: 'btn', id: 'submit-anyway', onclick: () => finish() }, 'Entregar igualmente')) : null;

  const dots = !S.instant ? h('div', {},
    h('div', { class: 'label', style: 'margin-top:18px' }, 'Ir a la pregunta'),
    h('div', { class: 'dots' }, S.qs.map((_, i) => h('button', {
      class: 'dot' + (S.ans[i] != null ? ' done' : '') + (i === S.i ? ' cur' : ''), id: 'dot-' + i,
      'aria-label': 'Pregunta ' + (i + 1), onclick: () => { S.i = i; S.confirm = false; render(quizView()); } }, i + 1)))) : null;

  return h('div', {},
    h('div', { class: 'qbar' },
      h('div', { class: 'qbar-row' },
        h('span', { class: 'title' }, S.title),
        h('span', { class: 'mono' }, (S.i + 1) + ' / ' + S.qs.length),
        h('button', { class: 'btn ghost', id: 'quit', onclick: () => {
          if (S.kind === 'practice' && doneN) render(resultView()); else render(home());
        } }, S.kind === 'practice' && doneN ? 'Terminar' : 'Salir')),
      h('div', { class: 'progress' }, h('div', { style: 'width:' + ((S.instant ? doneN : S.i + 1) / S.qs.length * 100) + '%' }))),
    h('div', { class: 'qcard' },
      h('div', { class: 'qtag' }, h('span', { class: 'chip mono' }, 'TEMA ' + ROM[q.t] + ' · Nº ' + q.n),
        status(q) === 'ko' && !reveal ? h('span', { class: 'mono', style: 'color:var(--bad)' }, 'LA FALLASTE ANTES') : null),
      h('p', { class: 'qtext' }, q.q),
      opts, verdict, nav, confirmBox,
      h('p', { class: 'hint', style: 'margin:0' }, 'Teclado: A, B, C para responder · Enter para continuar'),
      dots));
}

function resultView() {
  const done = S.qs.map((q, i) => ({ q, a: S.ans[i] })).filter(x => S.kind === 'exam' || x.a != null);
  const okN = done.filter(x => x.a === x.q.a).length;
  const n = done.length;
  const pct = n ? Math.round(okN / n * 100) : 0;
  const wrong = done.filter(x => x.a !== x.q.a);
  const temas = [...new Set(done.map(x => x.q.t))].sort((a, b) => a - b);

  return h('div', {},
    h('section', { class: 'score' },
      h('span', { class: 'label' }, S.kind === 'exam' ? 'Resultado del simulacro' : S.title),
      h('div', { class: 'big' }, okN, h('small', {}, ' / ' + n + ' · ' + pct + '%')),
      h('span', {}, wrong.length ? wrong.length + (wrong.length === 1 ? ' fallo' : ' fallos') + '. Abajo tienes la respuesta correcta de cada uno.' : 'Sin fallos. Así se llega tranquilo al examen.')),
    temas.length > 1 ? h('div', {},
      h('div', { class: 'section-head' }, h('h2', {}, 'Por temas')),
      h('ul', { class: 'bytema' }, temas.map(t => {
        const xs = done.filter(x => x.q.t === t); const k = xs.filter(x => x.a === x.q.a).length;
        return h('li', {}, h('span', { class: 'num' }, ROM[t]),
          h('div', { class: 'bar', style: 'margin:0' }, h('div', { class: 'ok', style: 'width:' + (k / xs.length * 100) + '%' }), h('div', { class: 'ko', style: 'width:' + ((xs.length - k) / xs.length * 100) + '%' })),
          h('span', { class: 'frac' }, k + '/' + xs.length));
      }))) : null,
    h('div', { class: 'res-actions' },
      h('button', { class: 'btn primary', id: 'again', onclick: () => S.kind === 'exam' ? startExam() : render(home()) }, S.kind === 'exam' ? 'Otro simulacro' : 'Volver al inicio'),
      wrong.length ? h('button', { class: 'btn', id: 'retry-wrong', onclick: () => startPractice('Repaso de fallos', shuffle(wrong.map(x => x.q))) }, 'Repetir estos fallos') : null,
      S.kind === 'exam' ? h('button', { class: 'btn', id: 'home', onclick: () => render(home()) }, 'Volver al inicio') : null),
    wrong.length ? h('div', {},
      h('div', { class: 'section-head' }, h('h2', {}, 'Tus fallos')),
      h('div', { class: 'errors' }, wrong.map(x => h('article', { class: 'err' },
        h('span', { class: 'chip mono qtag', style: 'color:var(--muted)' }, 'TEMA ' + ROM[x.q.t] + ' · Nº ' + x.q.n),
        h('p', { style: 'font-weight:600' }, x.q.q),
        h('p', { class: 'yours' }, x.a == null ? 'Sin contestar' : 'Tu respuesta: ' + L[x.a] + ') ' + x.q.o[x.a]),
        h('p', { class: 'good' }, 'Correcta: ' + L[x.q.a] + ') ' + x.q.o[x.q.a]))))) : null);
}

document.addEventListener('keydown', e => {
  if (!S || !document.querySelector('.qcard') || /INPUT|TEXTAREA/.test(document.activeElement?.tagName || '') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const idx = { a: 0, b: 1, c: 2, '1': 0, '2': 1, '3': 2 }[k];
  if (idx != null) { e.preventDefault(); choose(idx); }
  else if (k === 'enter' || k === 'arrowright') { const b = document.getElementById('next'); if (b && !b.disabled && document.activeElement?.id !== 'next') { e.preventDefault(); b.click(); } }
  else if (k === 'arrowleft' && !S.instant) { e.preventDefault(); go(-1); }
});

render(home());
Sync.pull();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Sync.pull(); });
</script>

</body>
</html>
